[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergraph_agent"
version = "0.1.0"
description = "RecipeQuest: a small benchmark for relational policies, prerequisite inference and growing skill libraries"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Simone Scala" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
