# Study HP2 development (docs/studies/HP2_schema_priors.md): the setting of hp2_v2_stream.yaml on
# development worlds (allocation dev, namespace hp2_v2s_dev, never used for measurement), two
# seeds x 3 worlds x 16 episodes, every arm: checks that the arms run, measures runtime and sizes
# the measurement. Outcomes are calibration, not results.
run:
  name: hp2-dev-v2s
  phase: hp2_dev
  allocation: dev
  seeds: [0, 1]
  ledger: runs/HP2-ledger.json
budget:
  ledger_allocations: {dev: 31100, hp2: 288900}
  ledger_adaptive_cap: 320000
  ledger_reporting_cap: 161100
world:
  schema: {n_classes: 3, n_families: 4, scope: stream, hidden_classes: true}
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: hp2_v2s_dev
  n_tasks: 48
  track: inference
  n_worlds: 3
  episodes_per_world: 16
walker:
  per_run_cap: 927  # the largest task-budget sum of the two seeds' streams
  eval_world_offset_by_seed: true
  consistent_moves: 50
  hybrid: {scope: stream, classes: hidden, n_classes: 3, n_families: 4, model_prior: 0.5, oracle_floor: 0.01,
           max_models: 50000}
arms:
  - {id: posterior, strategy: focused_sample}
  - {id: hybrid, strategy: hybrid}
  - {id: rules_only, strategy: rules_only}
  - {id: oracle_schema, strategy: oracle_schema}
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
