# Study HP2, primary setting (docs/studies/HP2_schema_priors.md): schema worlds, version 1 (public
# class and family labels), a schema per world; the learned prior learns within each world. Family
# F1 otherwise (goal-only items, depth 1-3, no distractor base facts, deterministic), namespace
# hp2_v1w, five seeds x ten worlds x 16 episodes, every seed its own worlds. Allocation hp2.
run:
  name: hp2-v1w
  phase: hp2_main
  allocation: hp2
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/HP2-ledger.json
budget:
  ledger_allocations: {dev: 31100, hp2: 288900}
  ledger_adaptive_cap: 320000
  ledger_reporting_cap: 161100
world:
  schema: {n_classes: 3, n_families: 4, scope: world, hidden_classes: false}
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: hp2_v1w
  n_tasks: 160
  track: inference
  n_worlds: 10
  episodes_per_world: 16
walker:
  per_run_cap: 3184  # the largest task-budget sum of the five seeds' streams: no run can be cut short
  eval_world_offset_by_seed: true
  consistent_moves: 50
  hybrid: {scope: world, classes: public, n_classes: 3, n_families: 4, model_prior: 0.5, oracle_floor: 0.01,
           max_models: 50000}
arms:
  - {id: posterior, strategy: focused_sample}
  - {id: hybrid, strategy: hybrid}
  - {id: rules_only, strategy: rules_only}
  - {id: oracle_schema, strategy: oracle_schema}
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
