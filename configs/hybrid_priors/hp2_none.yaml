# Study HP2, harm check (docs/studies/HP2_schema_priors.md): worlds with the public class and family
# labels of version 1 but no schema (the classes are decoys, requirements follow the default rule);
# the same agents as the primary setting. Namespace hp2_none, five seeds x ten worlds x 16 episodes.
# Allocation hp2.
run:
  name: hp2-none
  phase: hp2_main
  allocation: hp2
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/HP2-ledger.json
budget:
  ledger_allocations: {dev: 31100, hp2: 288900}
  ledger_adaptive_cap: 320000
  ledger_reporting_cap: 161100
world:
  schema: {n_classes: 3, n_families: 4, scope: none, hidden_classes: false}
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: hp2_none
  n_tasks: 160
  track: inference
  n_worlds: 10
  episodes_per_world: 16
walker:
  per_run_cap: 3218  # the largest task-budget sum of the five seeds' streams: no run can be cut short
  eval_world_offset_by_seed: true
  consistent_moves: 50
  hybrid: {scope: world, classes: public, n_classes: 3, n_families: 4, model_prior: 0.5, oracle_floor: 0.01,
           max_models: 50000}
arms:
  - {id: posterior, strategy: focused_sample}
  - {id: hybrid, strategy: hybrid}
  - {id: rules_only, strategy: rules_only}
  - {id: oracle_schema, strategy: oracle_schema}
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
