# Study X, tuning stage (pre-registered; allocation x_tune, namespaces ending in _dev), setting
# rq_f1. Every candidate trains once (training seed 0) for 100,000 interactions on
# x_rq_tune_train_dev and is evaluated in both action modes on x_rq_tune_eval_dev (2 seeds x
# 10 worlds x 16 episodes). Per learner group, the (candidate, mode) with the lowest mean late
# cost ratio is written into rq_f1_main.yaml by a dated amendment (run.tuning_record); ties go
# to the earlier candidate in this list, then to the deterministic mode.
run: {name: x-rq-tune, allocation: x_tune, ledger: runs/X-ledger.json}
ledger:
  allocations: {dev: 300000, x_tune: 4500000, x_main: 40000000}
  adaptive_cap: 44800000
  reporting_cap: 5000000
setting:
  name: rq_f1
  family: recipequest
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
train: {namespace: x_rq_tune_train_dev, base_seed: 30000, seeds: [0], budgets: [100000], n_envs: 8,
        episodes_per_world: 16}
test: {namespace: x_rq_tune_eval_dev, base_seed: 10000, seeds: [0, 1], n_worlds: 10, episodes_per_world: 16}
learners:
  - {id: mppo, group: mppo, algo: maskable_ppo, params: {n_steps: 256}, modes: [deterministic, stochastic]}
  - {id: mppo.ent, group: mppo, algo: maskable_ppo, params: {n_steps: 256, ent_coef: 0.01},
     modes: [deterministic, stochastic]}
  - {id: mppo.wide, group: mppo, algo: maskable_ppo,
     params: {n_steps: 256, ent_coef: 0.01, policy_kwargs: {net_arch: [256, 256]}},
     modes: [deterministic, stochastic]}
  - {id: ppo, group: ppo, algo: ppo, params: {n_steps: 256}, modes: [deterministic, stochastic]}
  - {id: ppo.ent, group: ppo, algo: ppo, params: {n_steps: 256, ent_coef: 0.01},
     modes: [deterministic, stochastic]}
  - {id: ppo.wide, group: ppo, algo: ppo,
     params: {n_steps: 256, ent_coef: 0.01, policy_kwargs: {net_arch: [256, 256]}},
     modes: [deterministic, stochastic]}
  - {id: rppo, group: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}},
     modes: [deterministic, stochastic]}
  - {id: rppo.ent, group: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512, ent_coef: 0.01,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}},
     modes: [deterministic, stochastic]}
  - {id: rppo.long, group: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512, ent_coef: 0.01, gamma: 0.999,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}},
     modes: [deterministic, stochastic]}
  - {id: mppo_rnd, group: mppo_rnd, algo: maskable_ppo, params: {n_steps: 256}, rnd: {beta: 0.01},
     modes: [deterministic, stochastic]}
  - {id: mppo_rnd.b01, group: mppo_rnd, algo: maskable_ppo, params: {n_steps: 256}, rnd: {beta: 0.1},
     modes: [deterministic, stochastic]}
agents: []
analysis:
  late_from: 8
  select_metric: cost_ratio_late
  select_split: test
  tests: []
