# Study X, measurement draft, setting tt_u_k3: TechTree cell k3-off-ann of study U (4 base
# primitives, 3 extra slots, a key of 3 base primitives that activates one slot, the goal an
# entry of 3 symbols using that slot; no signal; announced unlocks; budget 100; 12 episodes
# per world). Test x_tt_u_test: 5 seeds x 6 worlds (the layout of study U); validation
# x_tt_u_val: 2 seeds x 6 worlds. The repository's arms of that cell play the test stream.
run: {name: x-ttu-main, allocation: x_main, ledger: runs/X-ledger.json, requires_flag: true,
      tuning_record: null}
ledger:
  allocations: {dev: 300000, x_tune: 4500000, x_main: 40000000}
  adaptive_cap: 44800000
  reporting_cap: 5000000
setting:
  name: tt_u_k3
  family: techtree
  agent_study: U
  world: {n_primitives: 4, n_slots: 3, n_unlocks: 1, unlock_level: 1, n_levels: 1, concepts_per_level: [2],
          combo_length: 3}
  stream: {goal_levels: [1], goal_rule: unlock, episode_budget: 100, unlock_visibility: announced,
           signal: false}
train: {namespace: x_tt_u_train, base_seed: 30000, seeds: [0, 1], budgets: [10000, 100000, 1000000],
        n_envs: 8, episodes_per_world: 12}
test: {namespace: x_tt_u_test, base_seed: 0, seeds: [0, 1, 2, 3, 4], n_worlds: 6, episodes_per_world: 12}
validation: {namespace: x_tt_u_val, base_seed: 0, seeds: [0, 1], n_worlds: 6, episodes_per_world: 12}
learners:
  - {id: mppo, algo: maskable_ppo, params: {n_steps: 256}}
  - {id: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}}}
  - {id: mppo_rnd, group: maskable_ppo_rnd, algo: maskable_ppo, params: {n_steps: 256}, rnd: {beta: 0.01}}
agents: [pooled, oracle, reference, random]
analysis:
  late_from: 6
  select_metric: steps_late
  tests:
    - {name: "XU1 pooled - best learner, actions to first success", role: secondary, a: pooled,
       b: best_learner, metric: first_success_steps, expect: less}
    - {name: "XU2 pooled - best learner, late actions per episode", role: secondary, a: pooled,
       b: best_learner, metric: steps_late, expect: less}
    - {name: "XU3 best learner - random, actions to first success", role: secondary, a: best_learner,
       b: random, metric: first_success_steps, expect: less}
    - {name: "XU4 best learner - random, late actions per episode", role: secondary, a: best_learner,
       b: random, metric: steps_late, expect: less}
    - {name: "XU5 best learner, late minus early cost ratio", role: descriptive, a: best_learner,
       metric: cost_ratio_late_minus_early, expect: less}
