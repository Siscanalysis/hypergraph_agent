# Study X, development only (allocation dev, namespaces ending in _dev): plumbing and
# throughput of setting tt_u_k3 (TechTree, study U cell k3-off-ann). Two checkpoints of 8,000
# and 16,000 training interactions, one test seed with one world x 12 episodes, the
# repository's arms of that cell on the same worlds. Outcomes are not results.
run: {name: x-ttu-dev, allocation: dev, ledger: runs/X-ledger.json}
ledger:
  allocations: {dev: 300000, x_tune: 4500000, x_main: 40000000}
  adaptive_cap: 44800000
  reporting_cap: 5000000
setting:
  name: tt_u_k3
  family: techtree
  agent_study: U
  world: {n_primitives: 4, n_slots: 3, n_unlocks: 1, unlock_level: 1, n_levels: 1, concepts_per_level: [2],
          combo_length: 3}
  stream: {goal_levels: [1], goal_rule: unlock, episode_budget: 100, unlock_visibility: announced,
           signal: false}
train: {namespace: x_tt_u_train_dev, base_seed: 30000, seeds: [0], budgets: [8000, 16000], n_envs: 8,
        episodes_per_world: 12}
test: {namespace: x_tt_u_eval_dev, base_seed: 0, seeds: [0], n_worlds: 1, episodes_per_world: 12}
learners:
  - {id: mppo, algo: maskable_ppo, params: {n_steps: 256}}
  - {id: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}}}
agents: [pooled, oracle, reference, random]
analysis:
  late_from: 6
  select_metric: steps_late
  select_split: test
  tests:
    - {name: "dev pooled - best learner, late actions", role: secondary, a: pooled, b: best_learner,
       metric: steps_late, expect: less}
