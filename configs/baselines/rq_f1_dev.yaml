# Study X, development only (allocation dev, namespaces ending in _dev): plumbing and
# throughput of setting rq_f1 (RecipeQuest family F1, goal-only observation). Two
# checkpoints of 8,000 and 16,000 training interactions per learner, one test seed with two
# worlds x 16 episodes, the repository's agents on the same worlds. Outcomes are not results.
# The ledger block is identical in every config of configs/baselines/, so whichever runs
# first creates runs/X-ledger.json with every allocation.
run: {name: x-rq-dev, allocation: dev, ledger: runs/X-ledger.json}
ledger:
  allocations: {dev: 300000, x_tune: 4500000, x_main: 40000000}
  adaptive_cap: 44800000
  reporting_cap: 5000000
setting:
  name: rq_f1
  family: recipequest
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
train: {namespace: x_rq_train_dev, base_seed: 30000, seeds: [0], budgets: [8000, 16000], n_envs: 8,
        episodes_per_world: 16}
test: {namespace: x_rq_eval_dev, base_seed: 10000, seeds: [0], n_worlds: 2, episodes_per_world: 16}
learners:
  - {id: mppo, algo: maskable_ppo, params: {n_steps: 256}}
  - {id: ppo, algo: ppo, params: {n_steps: 256}}
  - {id: rppo, algo: recurrent_ppo, trial: true,
     params: {features_dim: 64, batch_size: 512,
              policy_kwargs: {lstm_hidden_size: 64, shared_lstm: true, enable_critic_lstm: false}}}
  - {id: mppo_rnd, group: maskable_ppo_rnd, algo: maskable_ppo, params: {n_steps: 256}, rnd: {beta: 0.01}}
  - {id: dqn, algo: dqn, params: {buffer_size: 100000}}
agents: [focused_sample, maximal, reference, random]
agent_params: {consistent_moves: 50}
analysis:
  late_from: 8
  select_metric: cost_ratio_late
  select_split: test
  tests:
    - {name: "dev focused_sample - best learner, late cost ratio", role: primary, a: focused_sample,
       b: best_learner, metric: cost_ratio_late, expect: less}
