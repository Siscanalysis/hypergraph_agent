# Study control: matched open-loop macros mined from the same kind of
# trajectories (no learned controllers), same budgets and admission criteria.
# Set skills.mode to macro_retry for the explicitly named retry wrapper.
run:
  name: p3-macro
  phase: p3
  allocation: p3
  seeds: [0, 1]
  requires_flag: allow_full_study
  ledger: runs/ablation-ledger.json
budget:
  per_run_interactions: 6000
  pretraining_interactions: 9000
  batch_steps: 256
  ledger_allocations: {p2: 24000, p3: 84000}
  ledger_adaptive_cap: 108000
  ledger_reporting_cap: 20000
  reporting_eval_per_run: 1200
ppo: {epochs: 8}
train:
  world_mode: shared
  shared_world_seed: 3000
  goal_levels: [1, 2, 3]
  tasks: {profile: unknown_prerequisites, failure_prob: 0.1, p_init_base: 0.3, p_init_item: 0.2,
          n_distractor_base: 0}
eval:
  namespace: test
  n_tasks: 20
  goal_levels: [5, 6]
skills:
  mode: macro
  admission: {profile: diagnostic, min_episodes: 8, min_success: 0.5, min_primitive_steps: 2}
arms:
  - {id: G0, growth: true, revision: false}
  - {id: G1, growth: true, revision: true}
