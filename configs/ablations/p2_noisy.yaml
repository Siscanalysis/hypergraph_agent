# P2 with state-preserving failures (epsilon 0.1, known to the updater):
# failed attempts no longer eliminate hypotheses.
run:
  name: p2-noisy
  phase: p2
  allocation: p2
  seeds: [0, 1]
  requires_flag: allow_full_study
  ledger: runs/ablation-ledger.json
budget:
  per_run_interactions: 6000
  batch_steps: 256
  ledger_allocations: {p2: 24000, p3: 84000}
  ledger_adaptive_cap: 108000
  ledger_reporting_cap: 20000
  reporting_eval_per_run: 600
ppo: {epochs: 8}
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, failure_prob: 0.1,
          n_distractor_base: 0, budget_slack: 4}
eval:
  n_tasks: 30
  track: inference
  n_worlds: 5
  episodes_per_world: 6
arms:
  - {id: fixed_supergraph, encoder: gated, graph_mode: supergraph, topology: frozen_structure}
  - {id: adaptive_incidence, encoder: gated, graph_mode: active, topology: revise}
