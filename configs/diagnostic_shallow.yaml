# Shallow-task learning diagnostic (depth-1 tasks, known structure).
# Question: does the shared PPO core learn at all? Compare with a random agent
# on the same evaluation tasks:
#   python -m hypergraph_agent.evaluate --agent random --config configs/diagnostic_shallow.yaml
run:
  name: diag-shallow
  phase: diagnostic
  allocation: diagnostics
  seeds: [0]
budget:
  per_run_interactions: 4000
  batch_steps: 256
  reporting_eval_per_run: 400
ppo: {epochs: 8}
train:
  tasks: {depth_min: 1, depth_max: 1, n_distractor_base: 0}
eval:
  n_tasks: 30
arms:
  - {id: set, encoder: set}

