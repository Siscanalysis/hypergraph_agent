# End-to-end plumbing check of the three P1 encoders. Not a learning experiment.
run:
  name: smoke
  phase: smoke
  allocation: smoke
  seeds: [0]
budget:
  per_run_interactions: 600
  batch_steps: 256
  reporting_eval_per_run: 80
ppo: {epochs: 8}
train:
  tasks: {n_distractor_base: 0}
eval:
  n_tasks: 4
arms:
  - {id: set, encoder: set}
  - {id: incidence, encoder: incidence}
  - {id: gated, encoder: gated}
