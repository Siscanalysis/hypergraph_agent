# P3 development pilot: shared mechanics per seed block, hidden prerequisites,
# state-preserving failures (epsilon 0.1, public), varied initial inventories.
# Two pretraining prefixes x 9,000 + four arms x two seeds x 5,000 = 58,000
# (reduced from 6,000 per arm on 2026-10-07 before any pilot ran; see docs/DECISIONS.md A1).
run:
  name: p3-pilot
  phase: p3
  allocation: p3
  seeds: [0, 1]
budget:
  per_run_interactions: 5000
  pretraining_interactions: 9000
  batch_steps: 256
  reporting_eval_per_run: 1100
ppo: {epochs: 8}
train:
  world_mode: shared
  shared_world_seed: 3000
  goal_levels: [1, 2, 3]
  tasks: {profile: unknown_prerequisites, failure_prob: 0.1, p_init_base: 0.3, p_init_item: 0.2,
          n_distractor_base: 0}
eval:
  namespace: test
  n_tasks: 20
  track: frozen
  goal_levels: [5, 6]
skills:
  explore_before_discovery: 3000
  discovery_budget: 4500
  max_proposals: 8
  max_trained_per_round: 3
  max_admissions_per_round: 2
  practice_budget: 1200
  practice_timeout: 12
  validation_episodes: 10
  bc_epochs: 20
  admission: {profile: diagnostic, min_episodes: 8, min_success: 0.5, min_primitive_steps: 2}
  arm_discovery_after: 1500
  arm_discovery_budget: 2000
  val_goal_levels: [2, 3, 4]
  val_tasks: 20
arms:
  - {id: F0, growth: false, revision: false}
  - {id: F1, growth: false, revision: true}
  - {id: G0, growth: true, revision: false}
  - {id: G1, growth: true, revision: true}
