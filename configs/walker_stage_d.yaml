# Walker study, Stage D (docs/EXPERIMENT_PLAN.md, addendum W-D): longer streams
# per world. Five fresh held-out worlds (namespace test, never used by a walker
# study) x 16 episodes, intermediate items unobserved. The learned arm reuses
# Stage B's edit policy per seed. Primary endpoint: the cost ratio over
# episodes 9-16 of every world.
run:
  name: walk-d
  phase: walker_d
  allocation: walker_d
  seeds: [0, 1]
  ledger: runs/walker-ledger.json
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: test
  n_tasks: 80
  track: inference
  n_worlds: 5
  episodes_per_world: 16
walker:
  per_run_cap: 1450
  policy_from: runs/walk-b-collector-s{seed}-*/edit_policy.pt
  consistent_moves: 50
  benchmark_source: focused_sample
  benchmark_starts: 5
  policy: {iters: 1500, lr: 0.003, hidden: 32}
arms:
  - {id: focused_sample, strategy: focused_sample}
  - {id: learned_sample, strategy: learned_sample}
