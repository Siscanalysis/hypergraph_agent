# Study RL measurement (docs/studies/RL_rule_learners.md; drafted, not run): trace collection with X2's
# three fixed policies on generated family F1 worlds, items observable, seeds 0-4, twelve worlds per seed,
# 16 episodes per world, in two variants: slips (failure probability 0.1, requirements of 1-3 of six
# candidates as in X2) and out of class (requirements of 4 or 5 of eight candidates). Study X2's logs
# (x2-main-*: gen_obs and, descriptive only, its five benchmark sets) are read by the analysis only.
#   python -m hypergraph_agent.rules collect --config configs/rule_learners/rl_main.yaml --allow-measurement
#   python -m hypergraph_agent.rules rank --prefix rl-main- --x2-prefix x2-main- --out artifacts/rule_learners
run: {name: rl-main, phase: rl_main, allocation: rl, ledger: runs/RL-ledger.json, requires_flag: true}
ledger:
  allocations: {dev: 10000, rl: 82500}
  adaptive_cap: 92500
  reporting_cap: 48400
policies: [focused_sample, random_omit, maximal]
walker: {consistent_moves: 50, omit_prob: 0.663}
sets:
  - {name: slip, namespace: rl_slip, seeds: [0, 1, 2, 3, 4], n_worlds: 12, episodes_per_world: 16,
     failure_prob: 0.1}
  - {name: ooc, namespace: rl_ooc, seeds: [0, 1, 2, 3, 4], n_worlds: 12, episodes_per_world: 16,
     pool_size: 8, max_true: 5, arity_weights: [0, 0, 0, 0.5, 0.5]}
