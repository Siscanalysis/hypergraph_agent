# Plumbing check of P3: pretraining, one discovery round with permissive
# diagnostic thresholds (admissions here prove plumbing, not competence),
# fork into two arms, frozen-track evaluation.
run:
  name: smoke-p3
  phase: p3
  allocation: smoke
  seeds: [0]
budget:
  per_run_interactions: 500
  pretraining_interactions: 1500
  batch_steps: 200
  reporting_eval_per_run: 160
ppo: {epochs: 8}
train:
  world_mode: shared
  shared_world_seed: 7000
  goal_levels: [1, 2, 3]
  tasks: {profile: unknown_prerequisites, failure_prob: 0.1, p_init_base: 0.3, p_init_item: 0.2,
          n_distractor_base: 0}
eval:
  n_tasks: 3
  goal_levels: [5, 6]
skills:
  explore_before_discovery: 500
  discovery_budget: 800
  practice_budget: 300
  validation_episodes: 4
  bc_epochs: 5
  admission: {min_episodes: 2, min_success: 0.0, min_primitive_steps: 0}
  arm_discovery_after: 100
  arm_discovery_budget: 350
  val_tasks: 3
arms:
  - {id: F0, growth: false, revision: false}
  - {id: G1, growth: true, revision: true}
