# Study P, measurement (docs/studies/P_imperfect_skills.md): whether promoting
# discoveries to atoms of new hypotheses still pays when each discovery is an
# imperfect learned skill, whether an admission gate recovers the benefit and
# whether the utility problem appears. Primary: ungated promotion against
# remembering at e0 0.3 and depth 2 (the gated contrast is secondary S1; switched
# before any measurement run, see the protocol). Study L's phase-L2 setting (nothing
# supplied, every arm discovers level 1 itself) on fresh worlds (namespace
# techtree_p, never used before), at reuse depth 2 and 0 (control) on coupled
# worlds. Arms carry the initial skill error e0 in hundredths (`_e30`: 0.3);
# every arm of a seed sees the same worlds and the same controller draws.
# 8 seeds x 4 worlds = 32 worlds per depth, 12 episodes per world. Draft until frozen.
run: {name: p-main, study: P, allocation: p_main, seeds: [0, 1, 2, 3, 4, 5, 6, 7], ledger: runs/P-ledger.json,
      requires_flag: true}
ledger:
  allocations: {dev: 20000, p_main: 691200}
  adaptive_cap: 711200
  reporting_cap: 173600
world: {n_primitives: 3, n_levels: 3, concepts_per_level: [3, 3, 3], combo_length: 2, length_rule: linear}
stream: {namespace: techtree_p, n_worlds: 4, episodes_per_world: 12, goal_levels: [3], episode_budget: 100,
         reveal_levels: []}
agent: {half_practice: 10, gate_m: 2, gate_k: 3}
variants:
  - {name: d0, world: {reuse_depth: 0}}
  - {name: d2, world: {reuse_depth: 2}}
arms: [remember_e00, promote_e00, promote_gate_e00, remember_e10, promote_e10, promote_gate_e10,
       remember_e30, promote_e30, promote_gate_e30, oracle_library, reference]
analysis:
  late_from: 6
  tests:
    - {type: paired, role: primary, name: "P1 promote - remember, e0 0.3, depth 2", metric: steps_late,
       a: promote_e30, b: remember_e30, variant: d2, expect: less}
    - {type: equivalence, role: falsification,
       name: "F1 promote equivalent to remember, e0 0.3, depth 2 (+-10%)", metric: steps_late,
       a: promote_e30, b: remember_e30, variant: d2, margin_rel: 0.10, level: 0.90}
    - {type: paired, role: condition, name: "C1 control: promote - remember, e0 0.3, depth 0 (no benefit)",
       metric: steps_late, a: promote_e30, b: remember_e30, variant: d0, expect: not_less}
    - {type: paired, role: condition, name: "C2 study L reproduced: promote - remember, e0 0, depth 2",
       metric: steps_late, a: promote_e00, b: remember_e00, variant: d2, expect: less}
    - {type: paired, role: secondary, name: "S1 gated promotion: promote_gate - remember, e0 0.3, depth 2",
       metric: steps_late, a: promote_gate_e30, b: remember_e30, variant: d2, expect: less}
    - {type: paired, role: secondary,
       name: "S1b gated control: promote_gate - remember, e0 0.3, depth 0 (no benefit)",
       metric: steps_late, a: promote_gate_e30, b: remember_e30, variant: d0, expect: not_less}
    - {type: paired, role: secondary, name: "S2 promote - remember, e0 0.1, depth 2", metric: steps_late,
       a: promote_e10, b: remember_e10, variant: d2, expect: less}
    - {type: paired, role: secondary, name: "S3 gate recovers at depth 2: promote_gate - promote, e0 0.3",
       metric: steps_late, a: promote_gate_e30, b: promote_e30, variant: d2, expect: less}
    - {type: paired, role: secondary, name: "S4 gate recovers at depth 0: promote_gate - promote, e0 0.3",
       metric: steps_late, a: promote_gate_e30, b: promote_e30, variant: d0, expect: less}
    - {type: paired, role: secondary, name: "S5 utility problem: promote - remember, e0 0.3, depth 0",
       metric: steps_late, a: promote_e30, b: remember_e30, variant: d0, expect: greater}
    - {type: paired, role: secondary,
       name: "S6 study L's control reproduced: promote - remember, e0 0, depth 0",
       metric: steps_late, a: promote_e00, b: remember_e00, variant: d0, expect: not_less}
    - {type: interaction, role: secondary, name: "S7 gated benefit larger at depth 2 than 0, e0 0.3",
       metric: steps_late, a: promote_gate_e30, b: remember_e30, variant_hi: d2, variant_lo: d0, expect: less}
    - {type: equivalence, role: secondary,
       name: "S8 gate overhead without errors: promote_gate - promote, e0 0",
       metric: steps_late, a: promote_gate_e00, b: promote_e00, variant: d2, margin_rel: 0.10, level: 0.90}
    - {type: paired, role: secondary, name: "S9a cost of imperfect skills: promote e0 0.3 - e0 0, depth 2",
       metric: steps_late, a: promote_e30, b: promote_e00, variant: d2, expect: greater}
    - {type: paired, role: secondary, name: "S9b cost of imperfect skills: remember e0 0.3 - e0 0, depth 2",
       metric: steps_late, a: remember_e30, b: remember_e00, variant: d2, expect: greater}
    - {type: paired, role: secondary, name: "S10 primary on the whole stream", metric: steps_all,
       a: promote_e30, b: remember_e30, variant: d2, expect: less}
    - {type: paired, role: secondary, name: "S11 promote_gate - remember, e0 0.1, depth 2",
       metric: steps_late, a: promote_gate_e10, b: remember_e10, variant: d2, expect: less}
    - {type: paired, role: secondary, name: "S12 utility problem: promote - remember, e0 0.1, depth 0",
       metric: steps_late, a: promote_e10, b: remember_e10, variant: d0, expect: greater}
    - {type: interaction, role: secondary,
       name: "S13 advantage shrinks with errors: (promote - remember) e0 0.3 minus e0 0, depth 2",
       metric: steps_late, a: promote_e30, b: remember_e30, a_lo: promote_e00, b_lo: remember_e00,
       variant_hi: d2, variant_lo: d2, expect: greater}
    - {type: interaction, role: secondary,
       name: "S14 utility problem grows with errors: (promote - remember) e0 0.3 minus e0 0, depth 0",
       metric: steps_late, a: promote_e30, b: remember_e30, a_lo: promote_e00, b_lo: remember_e00,
       variant_hi: d0, variant_lo: d0, expect: greater}
    - {type: interaction, role: secondary, name: "S15 benefit larger at depth 2 than 0, e0 0.3",
       metric: steps_late, a: promote_e30, b: remember_e30, variant_hi: d2, variant_lo: d0, expect: less}
    - {type: all_success, role: validity, name: "V1 reference solves every task", arm: reference}
    - {type: all_success, role: validity, name: "V2 oracle library solves every task", arm: oracle_library}
    - {type: at_least_reference, role: validity, name: "V3 oracle library never shorter than the reference",
       arm: oracle_library}
  verdict:
    rule: precedence
    primary: "P1 promote - remember, e0 0.3, depth 2"
    falsification: "F1 promote equivalent to remember, e0 0.3, depth 2 (+-10%)"
    conditions: ["C1 control: promote - remember, e0 0.3, depth 0 (no benefit)",
                 "C2 study L reproduced: promote - remember, e0 0, depth 2"]
    validity: ["V1 reference solves every task", "V2 oracle library solves every task",
               "V3 oracle library never shorter than the reference"]
