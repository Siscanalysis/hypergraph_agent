# Study M, M2 anchors outside the factorial: the full-pool node and the
# privileged optimal plan on the same worlds and tasks as configs/markov/m2.yaml.
# Non-adaptive: charged to the reporting cap.
run:
  name: markov-m2-bounds
  phase: markov_m2
  allocation: m2
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/M-ledger.json
budget:
  ledger_allocations: {dev: 6000, m1: 18475, m2: 77650}
  ledger_adaptive_cap: 102125
  ledger_reporting_cap: 50500
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: markov_conf
  n_tasks: 160
  track: inference
  n_worlds: 10
  episodes_per_world: 16
walker:
  per_run_cap: 3148
  eval_world_offset_by_seed: true
arms:
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
