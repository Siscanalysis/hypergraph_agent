# Study M, M1 evidence collection (docs/studies/M_markov_ranking.md): family F1
# of the walker study (Stage D distribution, goal-only items, deterministic),
# selection worlds (namespace markov_sel), twelve worlds per seed x 16 episodes,
# every seed its own worlds; the PageRank setting is selected on seeds 0-1 and
# the primary contrast tested on seeds 2-4. focused_sample is charged to allocation m1,
# maximal (the brute-force contrast) to the reporting cap. Run with
#   python -m hypergraph_agent.markov_study collect --config configs/markov/m1_collect.yaml
run:
  name: markov-m1
  phase: markov_m1
  allocation: m1
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/M-ledger.json
budget:
  ledger_allocations: {dev: 6000, m1: 18475, m2: 77650}
  ledger_adaptive_cap: 102125
  ledger_reporting_cap: 50500
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: markov_sel
  n_tasks: 192
  track: inference
  n_worlds: 12
  episodes_per_world: 16
walker:
  # the largest sum of task budgets over the five seeds' streams: no run can be cut short
  per_run_cap: 3750
  eval_world_offset_by_seed: true
  consistent_moves: 50
arms:
  - {id: focused_sample, strategy: focused_sample}
  - {id: maximal, strategy: maximal}
