# Study M development runs (allocation dev, namespace markov_dev, never used
# for measurement): every M2 arm on two worlds x 16 episodes, seed 0. Checks
# that every arm completes tasks and measures runtime; outcomes are not results.
run:
  name: markov-dev
  phase: markov_dev
  allocation: dev
  seeds: [0]
  ledger: runs/M-ledger.json
budget:
  ledger_allocations: {dev: 6000, m1: 18475, m2: 77650}
  ledger_adaptive_cap: 102125
  ledger_reporting_cap: 50500
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: markov_dev
  n_tasks: 32
  track: inference
  n_worlds: 2
  episodes_per_world: 16
walker:
  per_run_cap: 620
  eval_world_offset_by_seed: true
  consistent_moves: 50
  # agents.markov parameters for development only (the M2 values come from M1)
  markov: {restart: 0.15, ppr_seed: effect, prior_strength: 2.0, rank_neighbours: true,
           proposal_floor: 0.1}
arms:
  - {id: focused_sample, strategy: focused_sample}
  - {id: hyper_rank, strategy: hyper_rank}
  - {id: pair_sample, strategy: pair_sample}
  - {id: pair_rank, strategy: pair_rank}
  - {id: hyper_sample_ppr, strategy: hyper_sample_ppr}
