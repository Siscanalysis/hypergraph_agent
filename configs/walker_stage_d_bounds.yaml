# Walker study, Stage D bounds: the full-pool node and the privileged optimal
# plan on the same 80 tasks (non-adaptive, one seed).
run:
  name: walk-d-bounds
  phase: walker_d
  allocation: walker_d
  seeds: [0]
  ledger: runs/walker-ledger.json
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: test
  n_tasks: 80
  track: inference
  n_worlds: 5
  episodes_per_world: 16
walker:
  per_run_cap: 1450
  policy_from: runs/walk-b-collector-s{seed}-*/edit_policy.pt
  consistent_moves: 50
  benchmark_source: focused_sample
  benchmark_starts: 5
  policy: {iters: 1500, lr: 0.003, hidden: 32}
arms:
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
