# Study PG (docs/studies/PG_policy_graph.md), measurement config, RecipeQuest family F1 of study R
# (Stage D generator, hidden prerequisites, goals at depth 1-3, intermediate items unobserved, no
# distractor base facts, failure probability 0). The worlds are study X's RecipeQuest test stream
# (namespace x_rq_test, base seed 10000 + 1000 x seed, seeds 0-4, 10 worlds x 16 episodes: 50
# worlds), reused so that pg can be paired with X's learners world by world; X finished with
# them and nothing of PG was tuned on them. The three policy-graph arms read common random numbers
# (agents/policygraph.py) and act identically in a world until its first success. Run with
# python -m hypergraph_agent.walk; analysed by evaluation.policygraph_study. Frozen with the protocol.
run:
  name: pg-rq-main
  phase: policygraph_rq
  allocation: pg_rq
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/PG-ledger.json
budget:
  ledger_allocations: {dev: 150000, pg_tt: 261600, pg_rq: 62400}
  ledger_adaptive_cap: 474000
  ledger_reporting_cap: 330000
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: x_rq_test
  base_seed: 10000
  n_tasks: 160
  track: inference
  n_worlds: 10
  episodes_per_world: 16
walker:
  per_run_cap: 3257  # the largest task-budget sum of the five seeds' streams: no run can be cut short
  eval_world_offset_by_seed: true
  consistent_moves: 50
  eval_variants:
    - {name: eps0, tasks: {failure_prob: 0.0}}
arms:
  - {id: pg, strategy: pg}
  - {id: pg_uniform, strategy: pg_uniform}
  - {id: pg_greedy, strategy: pg_greedy}
  - {id: focused_sample, strategy: focused_sample}
  - {id: maximal, strategy: maximal}
  - {id: reference, strategy: reference}
