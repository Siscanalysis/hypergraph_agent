# Study R development check (allocation `dev`): reproduce Stage D's
# focused_sample seed 0 (configs/walker_stage_d.yaml: the five worlds of
# namespace test x 16 episodes, goal-only, deterministic) with the noise-aware
# code. Per-episode primitive lengths and successes must equal the recorded
# runs/walk-d-focused_sample-default-s0-*/eval.jsonl.
run:
  name: rdev-stage-d
  phase: replication_dev
  allocation: dev
  seeds: [0]
  ledger: runs/R-ledger.json
budget:
  ledger_allocations: {dev: 10000, rep: 182330}
  ledger_adaptive_cap: 192330
  ledger_reporting_cap: 221860
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 1, depth_max: 3, n_distractor_base: 0,
          observe_items: goal_only}
eval:
  namespace: test
  n_tasks: 80
  track: inference
  n_worlds: 5
  episodes_per_world: 16
walker:
  per_run_cap: 1450
  consistent_moves: 50
arms:
  - {id: focused_sample, strategy: focused_sample}
