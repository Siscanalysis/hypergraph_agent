# Track 1 (frozen repertoire, zero-shot) on held-out longer compositions of the
# P3 pilot mechanics. Use with a P3 arm run directory:
#   python -m hypergraph_agent.evaluate --checkpoint runs/<p3 arm run> --config configs/transfer_frozen.yaml
# The shared world seed must match the evaluated run (pilot base 3000 + seed).
run:
  name: transfer-frozen
  phase: p3
  allocation: p3
budget:
  reporting_eval_per_run: 1500
train:
  world_mode: shared
  shared_world_seed: 3000
  tasks: {profile: unknown_prerequisites, failure_prob: 0.1, p_init_base: 0.3, p_init_item: 0.2,
          n_distractor_base: 0}
eval:
  namespace: test
  n_tasks: 50
  track: frozen
  goal_levels: [6, 7, 8]
arms:
  - {id: manager, graph_mode: active, topology: revise}
