# Full-study preset (NOT launched by default). Primary contrast: G1 versus G0
# on held-out longer compositions, ten independent seed blocks, equal all-in
# budgets per arm (logical pretraining charge included). Launch only with
#   python -m hypergraph_agent.train --config configs/study.yaml --allow-full-study
# after re-reading docs/EXPERIMENT_PLAN.md. Study controls live in configs/ablations/.
run:
  name: p3-study
  phase: p3
  allocation: p3
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  requires_flag: allow_full_study
  ledger: runs/study-ledger.json
budget:
  per_run_interactions: 60000
  pretraining_interactions: 90000
  batch_steps: 512
  reporting_eval_per_run: 4000
  # explicit study allowance: 10 x 90,000 pretraining + 40 x 60,000 arm runs
  ledger_allocations: {p3: 3300000}
  ledger_adaptive_cap: 3300000
  ledger_reporting_cap: 160000
ppo: {epochs: 8}
train:
  world_mode: shared
  shared_world_seed: 9000
  goal_levels: [1, 2, 3, 4]
  tasks: {profile: unknown_prerequisites, failure_prob: 0.1, p_init_base: 0.3, p_init_item: 0.2,
          n_distractor_base: 0}
eval:
  namespace: test
  n_tasks: 100
  track: frozen
  goal_levels: [6, 7, 8]
skills:
  explore_before_discovery: 30000
  discovery_budget: 45000
  max_proposals: 8
  max_trained_per_round: 4
  max_admissions_per_round: 2
  practice_budget: 8000
  practice_timeout: 16
  validation_episodes: 40
  admission: {profile: study, min_episodes: 40, min_success: 0.8, min_primitive_steps: 2}
  arm_discovery_after: 20000
  arm_discovery_budget: 25000
  val_goal_levels: [2, 3, 4, 5]
  val_tasks: 50
arms:
  - {id: F0, growth: false, revision: false}
  - {id: F1, growth: false, revision: true}
  - {id: G0, growth: true, revision: false}
  - {id: G1, growth: true, revision: true}
