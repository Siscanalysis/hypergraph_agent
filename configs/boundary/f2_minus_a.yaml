# Study R2 (docs/studies/R2_boundary.md), measurement (allocation `r2`),
# family F2-A: F2 with an alternative recipe for 25% of the items (F2: 60%); one
# factor removed from F2.
# Ten worlds per seed x 16 episodes, failure probability 0; every seed plays its
# own worlds.
# focused_sample is adaptive; maximal and the privileged reference are charged to
# the reporting cap.
run:
  name: r2-f2-a
  phase: boundary
  allocation: r2
  seeds: [0, 1, 2, 3, 4]
  ledger: runs/R2-ledger.json
budget:
  ledger_allocations: {dev: 6000, r2: 278000}
  ledger_adaptive_cap: 284000
  ledger_reporting_cap: 352000
world: {p_alternative: 0.25, pool_size: 8, max_true: 3, p_extra_item_input: 0.25}
train:
  world_mode: pool
  n_worlds: 8
  tasks: {profile: unknown_prerequisites, depth_min: 3, depth_max: 5, n_distractor_base: 0, observe_items: goal_only}
eval: {namespace: r2_f2_a, n_tasks: 160, track: inference, n_worlds: 10, episodes_per_world: 16}
walker:
  per_run_cap: 4256  # largest task-budget sum of the run streams
  eval_world_offset_by_seed: true
  consistent_moves: 50
  eval_variants:
  - name: eps0
    tasks: {failure_prob: 0.0}
arms:
- {id: focused_sample, strategy: focused_sample}
- {id: maximal, strategy: maximal}
- {id: reference, strategy: reference}
