# P1 development pilot: known structure, fixed operation set.
# Three non-equivalent encoders x two seeds x 4,500 interactions = 27,000
# (reduced from 6,000 on 2026-10-07 before any pilot ran; see docs/DECISIONS.md A1).
run:
  name: p1-pilot
  phase: p1
  allocation: p1
  seeds: [0, 1]
budget:
  per_run_interactions: 4500
  batch_steps: 256
  reporting_eval_per_run: 400
ppo: {epochs: 8}
train:
  world_mode: per_task
  tasks: {profile: known_structure, depth_min: 1, depth_max: 4, n_distractor_base: 0}
eval:
  namespace: val
  n_tasks: 30
  track: frozen
arms:
  - {id: set, encoder: set}
  - {id: incidence, encoder: incidence}
  - {id: gated, encoder: gated}
